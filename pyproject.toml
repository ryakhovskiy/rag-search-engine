[project]
name = "rag-search-engine"
version = "0.1.0"
description = "RAG Search Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "nltk==3.9.1",
    "numpy==2.3.3",
    "openai==2.44.0",
    "python-dotenv==1.1.0",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
keyword-search = "cli.keyword_search_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "cli"]

