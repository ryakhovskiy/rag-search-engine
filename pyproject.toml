[project]
name = "rag-search-engine"
version = "0.1.0"
description = "RAG Search Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nltk==3.9.1",
]

[project.scripts]
keyword-search = "cli.keyword_search_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "cli"]

